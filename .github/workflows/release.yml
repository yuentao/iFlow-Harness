name: Release

# Packaging/publishing happens ONLY on the release branch. The version number
# and release notes come from the topmost section of CHANGELOG.md (single
# source of truth); the version is written into package.json before packaging.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Read version + notes from the first "## [x.y.z] - date" section of
      # CHANGELOG.md. Exposed as steps.changelog.outputs.*. The script writes
      # GITHUB_OUTPUT itself; nothing else may land on its stdout.
      - name: Read version & notes from CHANGELOG.md
        id: changelog
        env:
          GITHUB_OUTPUT: ${{ github.output }}
        run: node scripts/read-changelog.mjs

      - name: Show resolved version
        run: |
          echo "version=${{ steps.changelog.outputs.version }}"
          echo "----- notes -----"
          echo "${{ steps.changelog.outputs.notes }}"

      # Stamp the CHANGELOG version into package.json (no manual sync needed).
      - name: Write version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.changelog.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build & package (.vsix)
        run: npm run package

      # Create/update the git tag and a GitHub-style release with the notes,
      # attaching the packaged .vsix as a downloadable asset.
      #
      # Draft pitfall: this action creates the release as a draft first and
      # only publishes it during finalization (after assets upload) — if
      # finalization is skipped the release stays Draft forever. Explicit
      # draft:false forces publish; make_latest must be a STRING per the
      # action's input table (a bare YAML boolean is ambiguous).
      - name: Create release with notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          make_latest: "true"
          files: iflow-harness-*.vsix
