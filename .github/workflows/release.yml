name: Release

# Packaging/publishing happens ONLY on the release branch. The version number
# and release notes come from the topmost section of CHANGELOG.md (single
# source of truth); the version is written into package.json before packaging.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Read version + notes from the first "## [x.y.z] - date" section of
      # CHANGELOG.md. Exposed as steps.changelog.outputs.*. The script writes
      # GITHUB_OUTPUT itself; nothing else may land on its stdout.
      - name: Read version & notes from CHANGELOG.md
        id: changelog
        env:
          GITHUB_OUTPUT: ${{ github.output }}
        run: node scripts/read-changelog.mjs

      - name: Show resolved version
        run: |
          echo "version=${{ steps.changelog.outputs.version }}"
          echo "----- notes -----"
          echo "${{ steps.changelog.outputs.notes }}"

      # Stamp the CHANGELOG version into package.json (no manual sync needed).
      - name: Write version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.changelog.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + String.fromCharCode(10));
          "

      - name: Build & package (.vsix)
        run: npm run package

      # Create or publish the release.
      #
      # Root cause of the original issue:
      # - `softprops/action-gh-release` v3 has a bug where `draft:false` is
      #   IGNORED unless `prerelease:true` is also set.
      #   See: https://github.com/softprops/action-gh-release/issues/379
      # - Additionally, duplicate workflow runs (e.g., manual re-run or release
      #   event triggering concurrent runs) can cause published releases to be
      #   reset back to draft status.
      #
      # Solution: use the native `gh` CLI which provides explicit, stateless
      # operations:
      #   - `gh release create` without --draft creates a published release
      #   - `gh release edit <tag> --draft=false` publishes an existing draft
      #   - `gh release upload <tag> <file> --clobber` overwrites assets
      # Notes are passed via an env var (GitHub preserves newlines in env
      # values) and written to a temp file to avoid shell-injection of
      # multiline markdown content.
      - name: Create or publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        shell: bash
        run: |
          TAG="v${{ steps.changelog.outputs.version }}"
          ASSET="iflow-harness-${{ steps.changelog.outputs.version }}.vsix"

          # Determine whether a release (draft or published) already exists.
          EXISTING_DRAFT=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.draft' 2>/dev/null || echo "null")

          case "$EXISTING_DRAFT" in
            true)
              # A draft exists from a previous run - attach the asset and publish it.
              echo "Publishing existing draft release for $TAG"
              sleep 5  # Wait for GitHub API eventual consistency
              gh release upload "$TAG" "$ASSET" --clobber
              gh release edit "$TAG" --draft=false
              ;;
            false)
              # Already published - refresh the asset only (never re-edit the release,
              # which is what caused the published to draft reset before).
              echo "Release $TAG already published; updating asset"
              gh release upload "$TAG" "$ASSET" --clobber
              ;;
            *)
              # No release yet - create a published one directly with notes + asset.
              echo "Creating new published release for $TAG"
              printf '%s' "$RELEASE_NOTES" > /tmp/release_notes.md
              gh release create "$TAG" \
                --title "v${{ steps.changelog.outputs.version }}" \
                --notes-file /tmp/release_notes.md \
                "$ASSET"
              rm -f /tmp/release_notes.md
              ;;
          esac